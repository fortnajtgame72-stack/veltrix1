<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veltrix Development</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--a:#8b5cf6;--b:#22d3ee;--bg:#07060d;--tx:#ecebf5;--mu:#8b89a3;--card:#11101c;--ln:#24223a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.logo{font-family:Sora,sans-serif;margin:0}
body.anim::before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(40% 40% at 20% 30%,color-mix(in srgb,var(--a) 35%,transparent),transparent),radial-gradient(35% 35% at 80% 70%,color-mix(in srgb,var(--b) 28%,transparent),transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg) scale(1.15)}}
body.bgimg{background-size:cover;background-attachment:fixed}
nav{display:flex;align-items:center;gap:14px;padding:14px 5vw;border-bottom:1px solid var(--ln);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5;background:#07060dcc}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo img{height:28px}.sp{flex:1}
a{color:inherit}button,.btn{font:600 14px Sora,sans-serif;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .2s}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px color-mix(in srgb,var(--a) 50%,transparent)}
button.g{background:transparent;border:1px solid var(--ln);color:var(--tx)}button.r{background:#e5484d}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--b);outline-offset:2px}
main{padding:30px 5vw 80px;max-width:var(--site-width,1200px);margin:auto}
.hero{padding:70px 0 40px}.hero h1{font-size:clamp(34px,6vw,68px);line-height:1.05;max-width:14ch}
body.anim .hero h1{animation:rise 1s cubic-bezier(.16,1,.3,1) both}body.anim .hero p{animation:rise 1s .18s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(8px)}}
.hero p{color:var(--mu);max-width:52ch;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:var(--a);box-shadow:0 14px 40px color-mix(in srgb,var(--a) 28%,transparent)}
.card .im{aspect-ratio:16/9;background:#000 center/cover}.card .bd{padding:16px}.card h3{font-size:17px}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--b)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:20px 0}
.gal img,.cover{width:100%;border-radius:14px;border:1px solid var(--ln);display:block}.gal img{cursor:zoom-in;transition:transform .3s}.gal img:hover{transform:scale(1.03)}
.gate{min-height:75vh;display:grid;place-items:center;text-align:center}.gate h1{font-size:clamp(30px,5vw,54px);margin-bottom:10px}
.pan{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
input,textarea{width:100%;background:#0b0a14;border:1px solid var(--ln);border-radius:10px;padding:10px;color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.li .t{flex:1}
.bar{height:8px;background:#0b0a14;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .2s}
.pv{display:flex;gap:8px;flex-wrap:wrap}.pv img{height:60px;border-radius:8px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--a);padding:12px 18px;border-radius:12px;transform:translateY(100px);transition:.3s;z-index:9}#toast.s{transform:none}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:20}#lb img{max-width:92vw;max-height:90vh;border-radius:12px}

/* Veltrix visual upgrade: stronger, visible motion and richer UI */
:root{--radius:18px;--motion:1;--glow:1}
body{background-image:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--a) 13%,transparent),transparent 42%),radial-gradient(ellipse at 90% 35%,color-mix(in srgb,var(--b) 10%,transparent),transparent 38%)}
nav{box-shadow:0 10px 35px #0005;border-bottom-color:color-mix(in srgb,var(--a) 25%,var(--ln))}
.logo{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--a) 40%,transparent))}
.hero{position:relative;padding-top:82px}.hero h1{letter-spacing:-2px;text-wrap:balance;text-shadow:0 8px 35px #0008}
.hero:after{content:"";display:block;width:min(240px,45vw);height:3px;margin-top:28px;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b),transparent);box-shadow:0 0 22px var(--a);animation:lineIn 1.2s .25s both}
@keyframes lineIn{from{width:0;opacity:0}to{opacity:1}}
.card,.pan{border-radius:var(--radius);backdrop-filter:blur(12px);box-shadow:0 14px 45px #0003}
.card{animation:cardIn .75s cubic-bezier(.16,1,.3,1) both;position:relative}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,#ffffff12,transparent 45%);opacity:.65}
.card:hover{transform:translateY(-9px) scale(1.012);box-shadow:0 22px 55px color-mix(in srgb,var(--a) 30%,#000)}
.card .im{transition:transform .65s cubic-bezier(.2,.8,.2,1);background-color:#090812}.card:hover .im{transform:scale(1.045)}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.pan{box-shadow:0 18px 55px #0004}.tabs button{border-radius:999px}.tag{background:color-mix(in srgb,var(--b) 8%,transparent)}
input,textarea{transition:border-color .2s,box-shadow .2s}input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
button,.btn{box-shadow:0 5px 18px color-mix(in srgb,var(--a) 18%,transparent)}
button:active,.btn:active{transform:scale(.97)}
.categorybar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}.categorybar button.active{box-shadow:0 0 0 2px var(--b),0 8px 25px color-mix(in srgb,var(--a) 30%,transparent)}
.toolbar{display:flex;gap:12px;align-items:center;margin:0 0 18px}.toolbar input{margin:0;max-width:360px}.hint{font-size:12px;color:var(--mu);margin-top:-7px;margin-bottom:12px}.uploadbox{padding:14px;border:1px dashed color-mix(in srgb,var(--a) 55%,var(--ln));border-radius:12px;background:#ffffff04;margin:8px 0 14px}
@media(max-width:650px){.hero{padding-top:48px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style></head><body class="anim"><div id="app"></div><div id="toast"></div><div id="lb" onclick="this.style.display='none'"><img></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(p,o={})=>{const r=await fetch("/api/"+p,{...o,headers:{"content-type":"application/json"},body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Greška");return d};
const toast=t=>{const e=$("#toast");e.textContent=t;e.className="s";setTimeout(()=>e.className="",2600)};
const fmt=n=>n>1e9?(n/1e9).toFixed(2)+" GB":(n/1e6).toFixed(1)+" MB";
const DEF={title:"Veltrix Development",tagline:"FiveM skripte, spremne za preuzimanje.",heroTitle:"Skripte koje drže server na nogama.",accent:"#8b5cf6",accent2:"#22d3ee",bg:"#07060d",logo:"",bgImage:"",anim:true,footer:"© Veltrix Development",announcement:"",font:"Inter",radius:18,glow:true,buttonText:"Preuzmi",siteWidth:1200};
let S={...DEF},U=null,ADMIN=false,SC=[],tab="scripts",categoryFilter="Sve",scriptSearch="";
function theme(){const r=document.documentElement.style;r.setProperty("--a",S.accent);r.setProperty("--b",S.accent2);r.setProperty("--bg",S.bg);
 document.body.classList.toggle("anim",!!S.anim);document.title=S.title;
 document.body.style.backgroundImage=S.bgImage?`linear-gradient(#07060dcc,#07060dcc),url(${S.bgImage})`:"";document.body.classList.toggle("bgimg",!!S.bgImage);document.documentElement.style.setProperty("--radius",(Number(S.radius)||18)+"px");document.documentElement.style.setProperty("--glow",S.glow?1:0);document.body.style.fontFamily=`${S.font||"Inter"},system-ui,sans-serif`;document.documentElement.style.setProperty("--site-width",(Number(S.siteWidth)||1200)+"px")}
function nav(){return`<nav><div class="logo" onclick="location.hash='#/'">${S.logo?`<img src="${esc(S.logo)}">`:""}${esc(S.title)}</div><div class="sp"></div>${U?`<span class="mu">${esc(U.name)}</span>${ADMIN?`<button class="g" onclick="location.hash='#/admin'">Admin</button>`:""}<button class="g" onclick="location='/api/auth/logout'">Odjava</button>`:""}</nav>`}
async function init(){try{S={...DEF,...await api("settings")}}catch{}theme();
 const m=await api("me");U=m.user;ADMIN=m.admin;
 if(!U)return $("#app").innerHTML=nav()+`<main class="gate"><div><h1>${esc(S.heroTitle)}</h1><p class="mu">${esc(S.tagline)}</p><br><a class="btn" href="/api/auth/login">Uloguj se preko Discorda</a></div></main>`;
 if(m.banned)return $("#app").innerHTML=nav()+`<main class="gate"><div><h1>Pristup blokiran</h1><p class="mu">Ovaj nalog je na blacklisti.</p></div></main>`;
 SC=await api("scripts");route()}
async function route(){const h=location.hash;if(!U)return;
 if(h.startsWith("#/s/"))return view(h.slice(4));if(h==="#/admin"&&ADMIN)return admin();home()}
function home(){const cats=["Sve",...new Set(SC.map(x=>x.category||"Ostalo").filter(Boolean))];const list=SC.filter(x=>(categoryFilter==="Sve"||(x.category||"Ostalo")===categoryFilter)&&(`${x.title} ${x.description||""}`).toLowerCase().includes(scriptSearch.toLowerCase()));
 $("#app").innerHTML=nav()+`<main><section class="hero"><h1>${esc(S.heroTitle)}</h1><p>${esc(S.tagline)}</p>${S.announcement?`<div class="pan" style="margin-top:24px;border-color:var(--a)">✦ ${esc(S.announcement)}</div>`:""}</section>
 <div class="toolbar"><input placeholder="Pretraži skripte..." value="${esc(scriptSearch)}" onchange="scriptSearch=this.value;home()"><span class="mu">${list.length} rezultata</span></div><div class="categorybar">${cats.map(c=>`<button class="${categoryFilter===c?"active":"g"}" onclick="categoryFilter='${esc(c).replace(/'/g,"&#39;")}';home()">${esc(c)}</button>`).join("")}</div>
 <div class="grid">${list.map((s,i)=>`<div class="card" style="animation-delay:${Math.min(i*65,500)}ms" onclick="location.hash='#/s/${s.id}'"><div class="im" style="background-image:url('${esc(s.cover||"")}')"></div><div class="bd"><span class="tag">${esc(s.category||"Ostalo")}</span><h3 style="margin-top:9px">${esc(s.title)}</h3><div class="mu">${esc((s.description||"").slice(0,90))}</div><p><span class="tag">v${esc(s.version)}</span> <span class="mu">${s.downloads||0} preuzimanja</span></p></div></div>`).join("")||`<p class="mu">Nema skripti u ovoj kategoriji.</p>`}</div></main><footer class="mu" style="text-align:center;padding:30px">${esc(S.footer)}</footer>`}
function view(id){const s=SC.find(x=>x.id===id);if(!s)return home();
 $("#app").innerHTML=nav()+`<main><button class="g" onclick="location.hash='#/'">Nazad</button><h1 style="margin:18px 0 6px">${esc(s.title)}</h1><p><span class="tag">${esc(s.category||"Ostalo")}</span> <span class="tag">v${esc(s.version)}</span> <span class="mu">${s.file_name?esc(s.file_name)+" · "+fmt(s.file_size):""}</span></p>
${s.cover?`<img class="cover" src="${esc(s.cover)}">`:""}<p style="white-space:pre-wrap">${esc(s.description)}</p>
<div class="gal">${(s.images||[]).map(i=>`<img src="${esc(i)}" onclick="zoom(this.src)">`).join("")}</div>
${s.file_key||s.file_name?`<a class="btn" href="/api/download/${s.id}">${esc(S.buttonText||"Preuzmi")}</a>`:""}
${s.changelog?`<div class="pan" style="margin-top:24px"><h3>Changelog</h3><p style="white-space:pre-wrap" class="mu">${esc(s.changelog)}</p></div>`:""}</main>`}
function zoom(u){const l=$("#lb");l.querySelector("img").src=u;l.style.display="grid"}
function up(file,kind,bar){return new Promise(async(ok,no)=>{try{
 const d=await api("admin/upload-url",{method:"POST",body:{kind,name:file.name,size:file.size,type:file.type}});
 const x=new XMLHttpRequest();x.open("PUT",d.url);x.setRequestHeader("content-type",file.type||"application/octet-stream");
 x.upload.onprogress=e=>{if(bar)bar.style.width=(e.loaded/e.total*100)+"%"};
 x.onload=()=>x.status<300?ok(d):no(new Error("Upload nije uspeo (proveri R2 CORS)"));x.onerror=()=>no(new Error("Upload nije uspeo (proveri R2 CORS)"));x.send(file)}catch(e){no(e)}})}
let ED=null;
async function admin(){const bl=tab==="bl"?await api("admin/blacklist"):[];
 const T=(k,n)=>`<button class="${tab===k?"":"g"}" onclick="tab='${k}';admin()">${n}</button>`;let b="";
 if(tab==="scripts")b=`<div class="pan"><h3>${ED?.id?"Izmeni skriptu":"Nova skripta"}</h3><div class="row"><div><label>Naslov</label><input id="f_t" value="${esc(ED?.title)}"></div><div><label>Verzija</label><input id="f_v" value="${esc(ED?.version||"1.0")}"></div></div>
<label>Kategorija</label><input id="f_cat" list="category-options" placeholder="npr. ESX, QBCore, UI, Jobs" value="${esc(ED?.category||"Ostalo")}"><datalist id="category-options">${[...new Set(SC.map(x=>x.category||"Ostalo"))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist><div class="hint">Izaberi postojeću kategoriju ili upiši novu. Nova kategorija se automatski pojavljuje na sajtu.</div>
<label>Opis</label><textarea id="f_d" rows="4">${esc(ED?.description)}</textarea><label>Changelog</label><textarea id="f_c" rows="3">${esc(ED?.changelog)}</textarea>
<div class="uploadbox"><label>Glavna slika</label><input type="file" id="f_cv" accept="image/png,image/jpeg,image/webp,image/gif"><label>Slike ispod (više njih)</label><input type="file" id="f_im" accept="image/png,image/jpeg,image/webp,image/gif" multiple><label>Arhiva .zip / .rar (max 800MB)</label><input type="file" id="f_fl" accept=".zip,.rar,application/zip,application/x-rar-compressed"><div class="hint">Dozvoljeni formati: PNG/JPG/WEBP/GIF i ZIP/RAR. Slike do 15 MB.</div><div class="bar"><i id="pb"></i></div></div>
<button onclick="saveS()">Sačuvaj skriptu</button> ${ED?`<button class="g" onclick="ED=null;admin()">Otkaži</button>`:""}</div>
<div class="pan"><h3>Objavljene skripte</h3>${SC.map(s=>`<div class="li"><div class="t"><b>${esc(s.title)}</b> <span class="tag">${esc(s.category||"Ostalo")}</span> <span class="mu">v${esc(s.version)} · ${s.downloads||0} dl</span></div><button class="g" onclick="ED=SC.find(x=>x.id==='${s.id}');admin();scrollTo(0,0)">Izmeni</button><button class="r" onclick="delS('${s.id}')">Obriši</button></div>`).join("")||'<span class="mu">Prazno</span>'}</div>`;
  if(tab==="look")b=`<div class="pan"><h3>Izgled i prilagođavanje sajta</h3><div class="row">${[["title","Naziv sajta"],["heroTitle","Glavni naslov"],["tagline","Podnaslov"],["footer","Footer"],["logo","Logo URL"],["bgImage","Pozadina – URL slike"],["announcement","Obaveštenje na početnoj"],["buttonText","Tekst dugmeta za preuzimanje"]].map(([k,n])=>`<div><label>${n}</label><input id="s_${k}" value="${esc(S[k]||"")}"></div>`).join("")}</div>
<div class="row"><div><label>Boja 1</label><input type="color" id="s_accent" value="${S.accent}"></div><div><label>Boja 2</label><input type="color" id="s_accent2" value="${S.accent2}"></div></div><div class="row"><div><label>Boja pozadine</label><input type="color" id="s_bg" value="${S.bg}"></div><div><label>Font</label><select id="s_font"><option ${S.font==="Inter"?"selected":""}>Inter</option><option ${S.font==="Sora"?"selected":""}>Sora</option><option ${S.font==="Arial"?"selected":""}>Arial</option><option ${S.font==="system-ui"?"selected":""}>system-ui</option></select></div></div>
<div class="row"><div><label>Zaobljenje kartica: <b id="radiusval">${Number(S.radius)||18}px</b></label><input type="range" min="6" max="32" id="s_radius" value="${Number(S.radius)||18}" oninput="document.getElementById('radiusval').textContent=this.value+'px'"></div><div><label>Širina sajta</label><select id="s_siteWidth"><option value="1000" ${S.siteWidth==1000?"selected":""}>Usko – 1000px</option><option value="1200" ${!S.siteWidth||S.siteWidth==1200?"selected":""}>Standard – 1200px</option><option value="1450" ${S.siteWidth==1450?"selected":""}>Široko – 1450px</option><option value="100%" ${S.siteWidth=="100%"?"selected":""}>Full width</option></select></div></div>
<div class="row"><div><label><input type="checkbox" id="s_anim" ${S.anim!==false?"checked":""} style="width:auto"> Pojačane animacije (3x)</label></div><div><label><input type="checkbox" id="s_glow" ${S.glow!==false?"checked":""} style="width:auto"> Glow efekti</label></div></div><button onclick="saveL()">Sačuvaj sva podešavanja</button><button class="g" onclick="previewTheme()">Pregled uživo</button></div>`;
 if(tab==="bl")b=`<div class="pan"><h3>Blacklista (važi na svim sajtovima)</h3><div class="row"><input id="b_id" placeholder="Discord ID"><input id="b_r" placeholder="Razlog"></div><button onclick="addB()">Dodaj</button></div>
<div class="pan">${bl.map(x=>`<div class="li"><div class="t"><b>${esc(x.discord_id)}</b> <span class="mu">${esc(x.reason)}</span></div><button class="g" onclick="rmB('${esc(x.discord_id)}')">Ukloni</button></div>`).join("")||'<span class="mu">Prazno</span>'}</div>`;
 $("#app").innerHTML=nav()+`<main><div class="tabs">${T("scripts","Skripte")}${T("look","Izgled")}${T("bl","Blacklista")}</div>${b}</main>`}
async function saveS(){try{const pb=$("#pb");const d={id:ED?.id,title:$("#f_t").value.trim(),version:$("#f_v").value.trim()||"1.0",category:$("#f_cat").value.trim()||"Ostalo",description:$("#f_d").value,changelog:$("#f_c").value};if(!d.title)throw new Error("Unesi naslov skripte.");
 const cv=$("#f_cv").files[0],im=[...$("#f_im").files],fl=$("#f_fl").files[0];
 if(cv)d.cover=(await up(cv,"image")).publicUrl;
 if(im.length)d.images=[...(ED?.images||[]),...await Promise.all(im.map(async f=>(await up(f,"image")).publicUrl))];
 if(fl){const r=await up(fl,"file",pb);d.file_key=r.key;d.file_name=fl.name;d.file_size=fl.size}
 await api("admin/scripts",{method:"POST",body:d});SC=await api("scripts");ED=null;toast("Sačuvano");admin()}catch(e){toast(e.message)}}
async function delS(id){if(!confirm("Obrisati skriptu?"))return;await api("admin/scripts/"+id,{method:"DELETE"});SC=await api("scripts");admin()}
async function saveL(){const n={};["title","heroTitle","tagline","footer","logo","bgImage","announcement","buttonText","accent","accent2","bg","font"].forEach(k=>n[k]=$("#s_"+k).value);n.anim=$("#s_anim").checked;n.glow=$("#s_glow").checked;n.radius=Number($("#s_radius").value);n.siteWidth=$("#s_siteWidth").value==="100%"?1600:Number($("#s_siteWidth").value);
 try{await api("admin/settings",{method:"POST",body:{...S,...n}});S={...S,...n};theme();toast("Podešavanja sajta su sačuvana");admin()}catch(e){toast("Greška pri čuvanju: "+e.message)}}
function previewTheme(){const n={};["accent","accent2","bg","font"].forEach(k=>n[k]=$("#s_"+k).value);n.radius=Number($("#s_radius").value);n.anim=$("#s_anim").checked;n.glow=$("#s_glow").checked;S={...S,...n};theme();toast("Pregled izgleda je aktivan – klikni Sačuvaj da ostane trajno") }
async function addB(){try{await api("admin/blacklist",{method:"POST",body:{discord_id:$("#b_id").value.trim(),reason:$("#b_r").value}});toast("Dodato");admin()}catch(e){toast(e.message)}}
async function rmB(id){await api("admin/blacklist?id="+id,{method:"DELETE"});admin()}
addEventListener("hashchange",route);init().catch(e=>$("#app").innerHTML=`<main class="gate"><p>${esc(e.message)}</p></main>`);
</script></body></html>
